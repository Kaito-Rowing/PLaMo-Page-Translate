<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLaMo Page Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="logo" aria-hidden="true">文<span>→</span>あ</div>
      <div>
        <h1>PLaMo Page Translate</h1>
        <p class="subtitle">ページ全体を、ローカルAIで日本語に。</p>
      </div>
      <span class="local-tag">LOCAL</span>
    </header>

    <section class="server-row" aria-live="polite">
      <span id="server-dot" class="dot checking"></span>
      <span id="server-status">翻訳サーバーを確認しています…</span>
      <button id="retry-server" class="text-button" title="接続を再確認">再確認</button>
    </section>

    <section class="card" aria-label="翻訳操作">
      <div class="language-row">
        <span class="language-label">元の言語 <strong>自動判定</strong></span>
        <span aria-hidden="true" class="direction">→</span>
        <span class="language-label">翻訳先 <strong>日本語</strong></span>
      </div>
      <button id="translate" class="primary">ページ全体を翻訳</button>
      <button id="restore" class="secondary" disabled>原文に戻す</button>
    </section>

    <section class="progress" aria-live="polite">
      <div class="progress-label">
        <span id="phase">待機中</span>
        <span id="count">0 / 0</span>
      </div>
      <div class="track"><div id="bar" class="bar"></div></div>
      <p id="message" class="message">翻訳するページを開いてボタンを押してください。</p>
    </section>
    <footer>llama.cpp · PLaMo 3 Translate 2B · 127.0.0.1:8000</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
