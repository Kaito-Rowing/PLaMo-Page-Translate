<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Translate</title><link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="brand"><img src="icons/icon-48.png" width="36" height="36" alt=""><div><h1>Page Translate</h1><p>ローカル翻訳のChrome拡張</p></div></div>
      <span class="local-badge">ローカル</span>
    </header>
    <section class="page-heading" aria-label="翻訳するページ">
      <h2>ページ翻訳</h2>
      <div class="page-context">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 4 4 14 0 18-4-4-4-14 0-18Z"/></svg>
        <span id="page-host">開いているページ</span><span class="context-divider" aria-hidden="true">/</span><span id="page-title">ページを確認しています…</span>
      </div>
    </section>
    <section class="translation-card" aria-label="翻訳操作">
      <div class="language-row">
        <div class="language"><span>元の言語</span><strong>自動判定</strong></div>
        <span class="language-arrow" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span>
        <div class="language target-language"><span>翻訳先</span><strong>日本語<span class="language-code">JA</span></strong></div>
      </div>
      <button id="translate" class="primary" disabled>
        <svg class="translate-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5h11M8 3v2m4 0c-1 6-4 9-9 12m2-9c1 3 3 5 6 7m3 6 4-10 4 10m-7-3h6"/></svg>
        <span id="translate-label">ページ全体を翻訳</span><span class="button-arrow" aria-hidden="true">→</span>
      </button>
      <button id="restore" class="restore" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4v6h6M4 10a8 8 0 1 1 1 8"/></svg>原文に戻す</button>
      <section id="page-progress" class="page-progress" hidden aria-live="polite">
        <div class="progress-label"><span id="phase">待機中</span><span id="count">0 / 0</span></div>
        <div id="translation-progress" class="track" role="progressbar" aria-label="ページの翻訳" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar" class="bar"></div></div>
      </section>
    </section>
    <p id="message" class="page-message" role="status">モデルを準備すると、翻訳を始められます。</p>
    <details id="engine-details" class="engine-card" open>
      <summary>
        <span class="engine-title"><span id="server-dot" class="dot checking"></span>モデル設定</span>
        <span id="server-status" class="engine-status" aria-live="polite">確認中</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="engine-content">
        <div class="model-meta"><strong>PLaMo 3 Translate</strong><span>2B · Q4_K_M</span></div>
        <p class="model-caption">初回のみ約1.81GBをダウンロード</p>
        <div class="engine-buttons"><button id="prepare" class="engine-button">GPUモデルを準備</button><button id="prepare-cpu" class="engine-button">CPUモデルを準備</button></div>
        <div id="download-progress" class="download-progress" hidden>
          <div id="model-progress" class="track" role="progressbar" aria-label="モデルの取得" aria-valuemin="0" aria-valuemax="100"><div id="download-bar" class="bar"></div></div>
          <span id="download-label"></span>
        </div>
        <p id="model-message" class="model-message" role="status">モデルはPC内に保存し、次回から再利用します。</p>
        <button id="retry-server" class="text-button">状態を再確認<span aria-hidden="true"> ↻</span></button>
      </div>
    </details>
    <footer><svg width="13" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg>翻訳はPC内で処理します</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
