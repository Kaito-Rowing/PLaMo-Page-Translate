<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLaMo Page Translate</title><link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="logo" aria-hidden="true">文<span>→</span>あ</div>
      <div><h1>PLaMo Page Translate</h1><p class="subtitle">ページ全体を、PC内のAIで日本語に。</p></div>
      <span class="local-tag">WebGPU</span>
    </header>
    <section class="server-row" aria-live="polite">
      <span id="server-dot" class="dot checking"></span><span id="server-status">モデルの状態を確認中…</span>
      <button id="retry-server" class="text-button" title="モデルの状態を確認">更新</button>
    </section>
    <section class="card" aria-label="モデルの準備">
      <p class="model-note">PLaMo 3 Translate 2B / Q4_K_M（初回約1.81GB）</p>
      <button id="prepare" class="secondary">GPUモデルを準備（初回ダウンロード）</button>
      <button id="prepare-cpu" class="secondary">CPU診断モードで準備（低速）</button>
      <button id="test" class="secondary" disabled>短い文章で動作確認</button>
      <div class="track"><div id="download-bar" class="bar"></div></div>
      <p id="model-message" class="message">モデルを一度保存すれば、次回以降はキャッシュを再利用します。</p>
    </section>
    <section class="card" aria-label="翻訳操作">
      <div class="language-row"><span class="language-label">元の言語 <strong>自動判定</strong></span><span aria-hidden="true" class="direction">→</span><span class="language-label">翻訳先 <strong>日本語</strong></span></div>
      <button id="translate" class="primary" disabled>ページ全体を翻訳</button>
      <button id="restore" class="secondary" disabled>原文に戻す</button>
    </section>
    <section class="progress" aria-live="polite">
      <div class="progress-label"><span id="phase">待機中</span><span id="count">0 / 0</span></div>
      <div class="track"><div id="bar" class="bar"></div></div>
      <p id="message" class="message">モデルを準備してから、翻訳ボタンを押してください。</p>
    </section>
    <footer>サーバー不要 · 翻訳データは外部送信しません · GPU / CPU切替</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
