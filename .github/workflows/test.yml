name: Verify and package extension
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:dom
      - run: npm run build
      - name: Package unpacked extension
        run: cd dist && zip -q -r ../plamo-page-translate-webgpu.zip .
      - name: Checksum
        run: sha256sum plamo-page-translate-webgpu.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plamo-page-translate-webgpu
          path: |
            plamo-page-translate-webgpu.zip
            SHA256SUMS.txt
          retention-days: 30
  windows-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plamo-page-translate-webgpu
          path: artifacts
      - name: Verify Windows install and update
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1 -PackagePath artifacts/plamo-page-translate-webgpu.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plamo-page-translate-webgpu
          path: artifacts
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" artifacts/plamo-page-translate-webgpu.zip artifacts/SHA256SUMS.txt --verify-tag --title "PLaMo Page Translate ${{ github.ref_name }}" --notes-file docs/release-notes.md
