name: Build and test browser-only extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package unpacked extension
        run: cd dist && zip -q -r ../plamo-page-translate-webgpu.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: plamo-page-translate-webgpu
          path: plamo-page-translate-webgpu.zip
          retention-days: 30
